name: Conductor CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conductor-smoke:
    name: Conductor smoke (Windows)
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the verified Conductor revision
        shell: pwsh
        run: python -m pip install 'conductor-cli @ git+https://github.com/microsoft/conductor.git@ac6b1f4abe8023a51045f946f67199b0f9fc47c8'
      - name: Run the Script step smoke test
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File ./.conductor/scripts/test-smoke.ps1
      - name: Validate the design workflow
        shell: pwsh
        run: conductor validate ./.conductor/workflows/design.yaml
      - name: Validate the implementation workflow
        shell: pwsh
        run: conductor validate ./.conductor/workflows/implement.yaml
      - name: Validate the PR review and merge workflows
        shell: pwsh
        run: |
          conductor validate ./.conductor/workflows/pr-review.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          conductor validate ./.conductor/workflows/merge-check.yaml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.5'
          cache-dependency-path: tools/conductor-poller/go.sum
      - name: Check the Polling Controller
        working-directory: tools/conductor-poller
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
