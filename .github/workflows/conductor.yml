name: Conductor CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.conductor/**'
      - '.github/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-files:
    name: Check changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip-smoke: ${{ steps.paths.outputs.skip-smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for changes outside the excluded paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- . \
              ':(top,exclude)docs/**' ':(top,exclude).conductor/**' \
              ':(top,exclude).github/**' ':(top,glob,exclude)*.md'; then
            echo 'skip-smoke=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi

  conductor-smoke:
    name: Conductor smoke (Windows)
    # A skipped job satisfies the required check for a PR. A failed path check runs the smoke test.
    needs: changed-files
    if: ${{ !cancelled() && (needs.changed-files.result != 'success' || needs.changed-files.outputs.skip-smoke != 'true') }}
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the verified Conductor revision
        shell: pwsh
        run: python -m pip install 'conductor-cli @ git+https://github.com/microsoft/conductor.git@ac6b1f4abe8023a51045f946f67199b0f9fc47c8'
      - name: Run the Script step smoke test
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File ./.conductor/scripts/test-smoke.ps1
      - name: Validate the design workflow
        shell: pwsh
        run: conductor validate ./.conductor/workflows/design.yaml
      - name: Validate the implementation workflow
        shell: pwsh
        run: conductor validate ./.conductor/workflows/implement.yaml
      - name: Validate the PR review and merge workflows
        shell: pwsh
        run: |
          conductor validate ./.conductor/workflows/pr-review.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          conductor validate ./.conductor/workflows/merge-check.yaml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.5'
          cache-dependency-path: tools/conductor-poller/go.sum
      - name: Check the Polling Controller
        working-directory: tools/conductor-poller
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
