name: Irisync CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Irisync Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.5'
          cache-dependency-path: go.sum
      - name: Check gofmt
        shell: pwsh
        run: |
          $files = go list -f '{{ $dir := .Dir }}{{ range .GoFiles }}{{ $dir }}/{{ . }}{{ "\n" }}{{ end }}{{ range .TestGoFiles }}{{ $dir }}/{{ . }}{{ "\n" }}{{ end }}{{ range .XTestGoFiles }}{{ $dir }}/{{ . }}{{ "\n" }}{{ end }}' ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @($files | Where-Object { $_ })
          $unformatted = gofmt -l @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            $unformatted | Write-Output
            throw 'Run gofmt on the listed files.'
          }
      - name: Vet
        run: go vet ./...
      - name: Test and smoke-test the CLI binaries
        run: go test -count=1 ./...
      - name: Build both CLIs
        run: go build -buildvcs=false ./cmd/controller ./cmd/agent
